<!DOCTYPE html>
<html>
<body style="font-family:Arial;background:#f5f7fa">

    <div style="width:55%;margin:60px auto;padding:30px;
                background:white;border-radius:12px;
                box-shadow:0 3px 12px #bbb">

        <h2 style="color:#0D47A1;text-align:center">Login Page</h2>

        <form style="display:grid;gap:15px">
            <label>
                User Name:
                <input type="text" style="width:100%;padding:9px">
            </label>

            <label>
                Password:
                <input type="password" style="width:100%;padding:9px">
            </label>

            <button style="padding:10px;background:#1565C0;
                           color:white;border:0">
                Login
            </button>
        </form>
    </div>

</body>
</html>
