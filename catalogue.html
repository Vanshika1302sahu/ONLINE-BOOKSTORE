<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
        }

        .box {
            width: 92%;
            margin: 25px auto;
            background: white;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #f3b37b;
        }

        button {
            background: #1565C0;
            color: white;
            border: 0;
            padding: 7px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Book Catalogue</h2>

        <table>
            <tr>
                <th>Book</th>
                <th>Author</th>
                <th>Publisher</th>
                <th>Price</th>
                <th>Action</th>
            </tr>

            <tr>
                <td>XML Bible</td>
                <td>Winston</td>
                <td>Wiley</td>
                <td>$40.5</td>
                <td><button>Add to Cart</button></td>
            </tr>

            <tr>
                <td>AI</td>
                <td>S. Russel</td>
                <td>Princeton Hall</td>
                <td>$63</td>
                <td><button>Add to Cart</button></td>
            </tr>

            <tr>
                <td>Java 2</td>
                <td>Watson</td>
                <td>BPB Publications</td>
                <td>$35.5</td>
                <td><button>Add to Cart</button></td>
            </tr>

            <tr>
                <td>HTML in 24 Hours</td>
                <td>Sam Peter</td>
                <td>Sam Publication</td>
                <td>$50</td>
                <td><button>Add to Cart</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
