<!DOCTYPE html>
<html>
<head>
    <title>JS Validation</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
        }

        .box {
            width: 65%;
            margin: 45px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #bbb;
        }

        h1 {
            color: #0D47A1;
            text-align: center;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: bold;
        }

        input {
            width: 96%;
            padding: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #1565C0;
            color: white;
            border: 0;
        }
    </style>

    <script>
        function validate() {
            let email = document.getElementById('email').value.trim();
            let phone = document.getElementById('phone').value.trim();

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                alert('Enter a valid e-mail ID');
                return false;
            }

            if (!/^\d{10}$/.test(phone)) {
                alert('Phone number must contain 10 digits');
                return false;
            }

            alert('E-mail and Phone are valid');
            return true;
        }
    </script>
</head>

<body>
    <div class="box">
        <h1>E-mail & Phone Validation</h1>

        <form onsubmit="return validate()">
            <label>E-mail ID</label>
            <input id="email" type="text"
                   placeholder="name@domain.com">

            <label>Phone Number</label>
            <input id="phone" type="text"
                   placeholder="10 digit number">

            <button type="submit">Validate</button>
        </form>
    </div>
</body>
</html>
