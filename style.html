<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background-image: linear-gradient(#dfefff, #ffffff);
            color: #222;
        }

        .hero {
            margin: 40px auto;
            width: 80%;
            padding: 50px;
            text-align: center;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 5px 18px #aaa;
        }

        h1 {
            font-family: Arial, sans-serif;
            color: #0D47A1;
            font-size: 40px;
            text-transform: uppercase;
        }

        .card {
            margin: 25px auto;
            padding: 25px;
            max-width: 650px;
            background-image: linear-gradient(135deg, #e8f1ff, #ffffff);
            border-left: 6px solid #1565C0;
        }

        .special {
            font-family: 'Courier New', monospace;
            color: #1565C0;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="hero">
        <h1>CSS Styling</h1>

        <div class="card">
            <p>
                This page demonstrates
                <span class="special">
                    different fonts, styles and background images
                </span>
                using CSS.
            </p>

            <p>
                CSS improves readability, layout and visual presentation.
            </p>
        </div>
    </div>
</body>
</html>
